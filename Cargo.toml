[workspace]
resolver = "2"
members = [
    "crates/bridge-core",
    "crates/bridge-iccoa",
    "crates/bridge-linux",
    "crates/bridge-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["carplaytocarlife contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
